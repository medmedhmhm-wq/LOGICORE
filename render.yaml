services:
  - type: web
    name: logicore-by-hameed
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: logicore-db
          property: connectionString
      - key: IIOT_HARDWARE_WRITE_ENABLED
        value: "false"
      - key: IIOT_READ_ONLY_MODE
        value: "true"

databases:
  - name: logicore-db
    plan: free
    region: frankfurt
    databaseName: industrial_automation_db
    user: logicore_user
